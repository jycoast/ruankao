events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # —— 反爬：IP 级粗筛（细粒度按用户限流在后端） ——
    # API 整体：每 IP 20r/s，突发 40
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # 登录/注册：每 IP 5r/m，防批量注册小号
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # 每 IP 并发连接上限
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # 拦截明显的脚本 UA（仅挡最低级爬虫，不作为主要防线）
    map $http_user_agent $blocked_ua {
        default                 0;
        ""                      1;
        "~*python-requests"     1;
        "~*python-urllib"       1;
        "~*scrapy"              1;
        "~*aiohttp"             1;
        "~*go-http-client"      1;
        "~*java/"               1;
        "~*curl"                1;
        "~*wget"                1;
    }

    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        limit_conn perip 20;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # sitemap.xml / robots.txt、/knowledge/:id、/essays/:id 现在都是构建期
        # 预渲染出的静态文件，随 dist/ 一起发布，落回下面的 location / 由静态服务
        # 直接命中即可。这里曾按 UA 把爬虫 rewrite 到后端直出 HTML（即 cloaking），
        # 那套连同 is_crawler map 已随后端 handler 一并删除 —— 别再按 UA 分流。

        location /api/auth/ {
            if ($blocked_ua) { return 403 '{"code":403,"message":"forbidden"}'; }
            limit_req zone=auth burst=10 nodelay;
            default_type application/json;
            proxy_pass http://backend/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            if ($blocked_ua) { return 403 '{"code":403,"message":"forbidden"}'; }
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 429/403 返回 JSON 而非默认 HTML
        error_page 429 = @toomany;
        location @toomany {
            default_type application/json;
            return 429 '{"code":429,"message":"操作过于频繁，请稍后再试"}';
        }
    }
}
