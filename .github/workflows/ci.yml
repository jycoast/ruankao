name: CI

# action 统一用最新大版本：原先的 checkout@v4 / setup-go@v5 / setup-node@v4 跑在 Node 20 上，
# GitHub 已报 deprecation notice（被强制在 Node 24 上运行）；v7 系列已完成 ESM 迁移、跑在 Node 24。
# 本文件用到的输入（go-version / node-version / cache / cache-dependency-path）签名在各版本间未变。

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: Backend (build + test)
    # 固定镜像，不用 ubuntu-latest：GitHub 公告 ubuntu-latest 自 2026-10-19 起迁往 Ubuntu 26，
    # 而这个仓库吃过平台静默变更的亏（Windows/Linux 时钟粒度、Node 大版本），不想让刚跑绿的
    # CI 被一次底层镜像升级打回红。要跟进时改这一行即可。
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: software_exam
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Test
        working-directory: backend
        run: go test ./...
        # 刻意不注入任何 SOFTWARE_EXAM_* 变量：viper 的 AutomaticEnv 会把它们当成
        # 配置来源，污染 config 包里断言 yaml 取值的用例（SOFTWARE_EXAM_DATABASE_PASSWORD
        # 曾把 TestLocalOverrideMergesOntoBase 顶红）。测试全部走 sqlmock，不连真库，
        # 用不到下面 services 起的 mysql。
      # 守住「公开仓库克隆下来仍能建库」。顶层只剩合并基线，改了基线而没跑通这里会直接红。
      # 必须用 config.example.yaml —— config.yaml 不入库，CI 里不存在。
      - name: Migrate smoke test
        working-directory: backend
        env:
          SOFTWARE_EXAM_DATABASE_HOST: 127.0.0.1
          SOFTWARE_EXAM_DATABASE_PASSWORD: root
          # example 是 mode: release，validate() 要求 secret 非空、≥32 字符且不是仓库占位值
          SOFTWARE_EXAM_JWT_SECRET: ci-migrate-smoke-secret-0123456789abcdef
        # 这一步失败时，Actions 页面上只看得到「exit code 1」—— 步骤原始日志要登录才能下载。
        # 而真正的错因在 migrate 自己的 log.Fatalf 里（配置 / 连库 / 某条 SQL），
        # 所以把输出收下来，失败时用 ::error:: 注解回抛（注解无需登录即可见）。
        # 只捕获输出、不改退出码：命令本身怎么跑还是怎么跑。
        run: |
          set +e
          out=$(go run ./cmd/migrate -config config/config.example.yaml 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            # 注解正文里换行要转义，用 | 压成一行；截断以免注解被 UI 折叠掉关键尾部
            msg=$(printf '%s' "$out" | tail -30 | tr '\n' '|' | cut -c1-2000)
            echo "::error title=migrate 退出码 $rc::$msg"
          fi
          exit "$rc"
      - name: Assert baseline tables
        run: |
          n=$(mysql -h127.0.0.1 -uroot -proot -N -B software_exam \
                -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='software_exam'")
          echo "tables=$n"
          # 43 张业务表 + schema_migrations
          [ "$n" -ge 44 ] || { echo "基线建表数不足：期望 >=44，实际 $n"; exit 1; }

  frontend:
    name: Frontend (type-check + build)
    # 同上：固定镜像，避免 ubuntu-latest 迁 Ubuntu 26 带来的静默平台变更。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 必须 >=22.12：unplugin@3（unplugin-vue-components 的依赖）用了
          # import.meta.dirname，Node 20.11+ 才有；vitest@5 声明 ^22.12.0。
          # 在 Node 18 下 npm ci 能过（仅 EBADENGINE 警告），但 vite build 加载
          # vite.config.ts 时会抛 ERR_INVALID_ARG_TYPE: paths[0] must be string。
          # 与开发机保持同一大版本。
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      # vitest 跑纯函数单测（environment: node，无组件测试）。
      # 放在 build 之前：单测失败比 vue-tsc/vite 报错定位快得多。
      - name: Test
        working-directory: frontend
        run: npm test
      # build = vue-tsc -b && vite build && prerender。
      # 构建期预渲染是 fail-soft：CI 里连不上 API，预渲染会告警并跳过，dist 也整个丢弃，
      # 所以这里给一个占位地址即可 —— vite.config.ts 的构建期断言只要求「非空」。
      # 真实部署必须由部署侧提供真实地址（见 frontend/build/apiBaseUrl.ts），缺了会直接构建失败。
      - name: Type-check + Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://api.invalid/api